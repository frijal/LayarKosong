<body>
<div class="card">
    <h1>🗓️ Kalkulator Minggu (Week Counter)</h1>
    <div class="subtitle">Biar nggak oleng ngitungin target mingguan</div>
    <div class="result-box">
        <p>Sekarang kita lagi di minggu ke:</p>
        <h2 id="current-week">--</h2>
        <p id="current-date-info">Tunggu sedelok...</p>
    </div>
    <div class="input-group">
        <label for="custom-date">Cek tanggal lain (monggo dipilih):</label>
        <input type="date" id="custom-date">
        <div class="custom-result" id="custom-result"></div>
    </div>
    <div class="footer">
        Digawe khusus nggo ngitung waktu ben ra keteteran.
    </div>
</div>
<script>
    /**
     * Fungsi buat ngitung ISO 8601 Week Number
     * Nggak bisa cuma dibagi 7, karena standar ISO netapin minggu ke-1 
     * adalah minggu yang punya hari Kamis pertama di tahun tersebut.
     */
    function getWeekNumber(d) {
        // Copy tanggal biar nggak ngubah referensi asli
        const date = new Date(d.getTime());
        // Set jam ke 00:00:00 biar aman dari offset zona waktu
        date.setHours(0, 0, 0, 0);
        // Geser ke hari Kamis di minggu yang sama (Minggu=0, Senin=1, dst)
        date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
        // Ambil tanggal 4 Januari dari tahun yang udah digeser (pasti masuk minggu 1)
        const week1 = new Date(date.getFullYear(), 0, 4);
        // Hitung selisih hari, lalu bagi 7 dapet deh minggu ke berapa
        return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }
    // Nampilin data hari ini pas halaman diload
    const today = new Date();
    const currentWeek = getWeekNumber(today);
    document.getElementById('current-week').innerText = currentWeek;
    // Bikin format tanggalnya lebih manusiawi (bahasa Indo)
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('current-date-info').innerText = today.toLocaleDateString('id-ID', options);
    // Dengerin perubahan di kotak input tanggal
    const dateInput = document.getElementById('custom-date');
    const customResult = document.getElementById('custom-result');
    dateInput.addEventListener('change', function(e) {
        if (this.value) {
            const selectedDate = new Date(this.value);
            const weekNum = getWeekNumber(selectedDate);
            customResult.innerText = `Mantap, tanggal itu masuk di minggu ke-${weekNum} lur!`;
        } else {
            customResult.innerText = '';
        }
    });
</script>
