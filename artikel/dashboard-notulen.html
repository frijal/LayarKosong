    <script>
        let topicCount = 1;
        // Formatter Waktu
        function formatDateTime(datetimeStr) {
            if (!datetimeStr) return '-';
            const date = new Date(datetimeStr);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('id-ID', options) + ' WIB';
        }
        // Fungsi Tambah Topik
        function addTopic() {
            topicCount++;
            const container = document.getElementById('topics-container');
            const topicHTML = `
                <div class="topic-input-block bg-white p-5 rounded-xl border-2 border-slate-200 shadow-sm relative mt-4" id="topic-block-${topicCount}" data-id="${topicCount}">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                        <h3 class="font-bold text-slate-700 flex items-center gap-2">
                            <span class="bg-slate-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">${topicCount}</span>
                            Topik Pembahasan Baru
                        </h3>
                        <button type="button" onclick="removeTopic(${topicCount})" class="text-red-500 hover:text-red-700 text-sm font-semibold flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> Hapus
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Pokok Bahasan</label>
                            <textarea id="agenda-${topicCount}" rows="2" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Bahas apa nih?"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Hasil & Keputusan 💡</label>
                            <textarea id="hasil-${topicCount}" rows="3" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Kesimpulannya apa?"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Action Items (Tindak Lanjut) 🚀</label>
                            <textarea id="tindaklanjut-${topicCount}" rows="3" class="live-update w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50/50" placeholder="- Tugas A (PIC: Budi)"></textarea>
                        </div>
                    </div>
                </div>
            `;
            // Insert element
            container.insertAdjacentHTML('beforeend', topicHTML);
            // Re-attach listener buat elemen baru
            attachLiveUpdateListeners();
            updatePreview();
        }
        // Fungsi Hapus Topik
        function removeTopic(id) {
            const el = document.getElementById(`topic-block-${id}`);
            if (el) {
                el.remove();
                updatePreview();
            }
        }
        // Engine Live Update
        function updatePreview() {
            // Update Info Umum
            document.getElementById('prev-judul').innerText = document.getElementById('judul').value || 'NOTULEN RAPAT';
            document.getElementById('prev-waktu').innerText = formatDateTime(document.getElementById('waktu').value);
            document.getElementById('prev-lokasi').innerText = document.getElementById('lokasi').value || '-';
            // Ambil teks peserta, pecah per baris (enter)
            const rawPeserta = document.getElementById('peserta').value.trim();
            const prevPesertaEl = document.getElementById('prev-peserta');
            if (rawPeserta) {
                // Saring baris yang kosong biar nggak ikut kehitung
                // Sekaligus amankan dari tag HTML liar (XSS prevention)
                const lines = rawPeserta
                    .split('\n')
                    .filter(line => line.trim() !== '')
                    .map(line => line.replace(/</g, "&lt;").replace(/>/g, "&gt;"));
                // Cari titik tengah (dibulatkan ke atas biar kalau ganjil, sisa 1 masuk ke kiri)
                const mid = Math.ceil(lines.length / 2);
                // Belah array jadi dua bagian, gabungkan dengan <br> untuk pindah baris
                const col1 = lines.slice(0, mid).join('<br>');
                const col2 = lines.slice(mid).join('<br>');
                // Injeksi ke dalam preview menggunakan sistem Grid 2 Kolom Tailwind
                prevPesertaEl.innerHTML = `
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <div>${col1}</div>
                        <div>${col2}</div>
                    </div>
                `;
            } else {
                prevPesertaEl.innerHTML = '-';
            }
            // Clear & Render Topics
            const prevContainer = document.getElementById('prev-topics-container');
            prevContainer.innerHTML = ''; 
            const inputBlocks = document.querySelectorAll('.topic-input-block');
            inputBlocks.forEach((block, index) => {
                const id = block.getAttribute('data-id');
                const num = index + 1; // Untuk penomoran berurutan di preview
                const valAgenda = document.getElementById(`agenda-${id}`).value || 'Belum ada agenda dicatat.';
                const valHasil = document.getElementById(`hasil-${id}`).value || 'Belum ada keputusan.';
                const valTindak = document.getElementById(`tindaklanjut-${id}`).value || 'Belum ada action items.';
                const topicPrevHTML = `
                    <div class="topic-prev-block mb-6 pt-4 border-t-2 border-slate-200">
                        <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <span class="bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">${num}</span>
                            PEMBAHASAN ${num}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- Kolom Kiri: Bahasan & Hasil -->
                            <div>
                                <div class="mb-5">
                                    <h3 class="font-bold text-[15px] text-slate-700 uppercase mb-2">A. Pokok Bahasan</h3>
                                    <div class="whitespace-pre-wrap pl-3 border-l-2 border-slate-400 py-1 text-slate-800">${valAgenda}</div>
                                </div>
                                <div>
                                    <h3 class="font-bold text-[15px] text-slate-700 uppercase mb-2">B. Hasil & Keputusan</h3>
                                    <div class="whitespace-pre-wrap pl-3 border-l-2 border-slate-800 py-1 font-medium text-slate-900">${valHasil}</div>
                                </div>
                            </div>
                            <!-- Kolom Kanan: Tindak Lanjut -->
                            <div class="h-full">
                                <div class="h-full flex flex-col">
                                    <h3 class="font-bold text-[15px] text-blue-700 uppercase mb-2">C. Tindak Lanjut (Action Items)</h3>
                                    <div class="whitespace-pre-wrap pl-3 border-l-2 border-blue-600 py-2 flex-1 bg-blue-50/70 rounded-r-md font-medium text-slate-800">${valTindak}</div>

        // Engine Upload & Preview Logo Perusahaan
        document.getElementById('logo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const prevLogo = document.getElementById('prev-logo');
            if (file) {
                // Baca file gambar yang diupload jadi format data URL
                const reader = new FileReader();
                reader.onload = function(event) {
                    prevLogo.src = event.target.result;
                    prevLogo.classList.remove('hidden'); // Munculkan logonya
                }
                reader.readAsDataURL(file);
            } else {
                // Kalau batal upload, sembunyikan lagi
                prevLogo.src = '';
                prevLogo.classList.add('hidden');
            }
        });
        // Pasang Event Listener ke semua input (termasuk yang baru di-generate)
        function attachLiveUpdateListeners() {
            const inputs = document.querySelectorAll('.live-update');
            inputs.forEach(input => {
                // Remove lama biar ga double event (opsional, tapi aman)
                input.removeEventListener('input', updatePreview);
                input.addEventListener('input', updatePreview);
            });
        }
        // Init pertama kali
        attachLiveUpdateListeners();
        updatePreview();
        // PDF Generation yang sudah kebal "Blank Page"
        function generatePDF() {
            updatePreview();
            const element = document.getElementById('pdf-wrapper');
            const judulRapat = document.getElementById('judul').value || 'Rapat';
            const fileName = 'Notulen_' + judulRapat.replace(/\s+/g, '_').substring(0, 30) + '.pdf';
            // 💡 TRIK JITU: Hapus border dan shadow sementara sebelum di-capture
            // Biar html2canvas nggak pusing ngerender efek 3D Tailwind
            element.classList.remove('shadow-2xl', 'border', 'border-slate-300', 'transform');
            const opt = {
                margin:       [0.3, 0.3, 0.3, 0.3],
                filename:     fileName,
                image:        { type: 'jpeg', quality: 1.0 },
                // 💡 TRIK JITU 2: Kunci koordinat scroll dan paksa lebar window
                html2canvas:  {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    scrollY: 0,
                    scrollX: 0,
                    windowWidth: 1200
                },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' },
                // 💡 TRIK JITU 3: Hapus 'avoid-all' agar render gak nge-lag / blank
                pagebreak:    { mode: ['css', 'legacy'] }
            };
            // Animasi Tombol Loading
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '⚙️ Memproses...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            // Eksekusi print
            html2pdf().set(opt).from(element).save().then(() => {
                // 💡 Kembalikan lagi class shadow dan bordernya setelah kelar print
                element.classList.add('shadow-2xl', 'border', 'border-slate-300', 'transform');
                // Kembalikan status tombol
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        }
    </script>
