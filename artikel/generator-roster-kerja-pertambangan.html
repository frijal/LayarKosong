      <input type="number" id="offDays" value="1" min="1">

        <label class="checkbox-item"><input type="checkbox" class="no-off-day" value="1" checked=""> Senin</label>
        <label class="checkbox-item"><input type="checkbox" class="no-off-day" value="2"> Selasa</label>

        <label class="checkbox-item"><input type="checkbox" class="no-off-day" value="6"> Sabtu</label>

      <select id="layoutMode">
        <option value="transpose">Transpose (Baris=Karyawan, Kolom=Tanggal)</option>

<script>
  function generateRoster() {
    const W = parseInt(document.getElementById('workDays').value);
    const O = parseInt(document.getElementById('offDays').value);
    const C = W + O; // Total durasi siklus
    const N = parseInt(document.getElementById('empCount').value);
    const startDateStr = document.getElementById('startDate').value;
    const endDateStr = document.getElementById('endDate').value;
    const layout = document.getElementById('layoutMode').value;
    const startDate = new Date(startDateStr);
    const endDate = new Date(endDateStr);
    if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
      alert("Pilih tanggal mulai dan tanggal selesai yang valid!");
      return;
    }
    if (endDate < startDate) {
      alert("Tanggal Selesai tidak boleh lebih awal dari Tanggal Mulai!");
      return;
    }
    const diffTime = endDate.getTime() - startDate.getTime();
    const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
    const restrictedDays = Array.from(document.querySelectorAll('.no-off-day:checked')).map(cb => parseInt(cb.value));
    // 1. Hitung Kuota Maksimal Libur Harian
    const validDayCount = 7 - restrictedDays.length;
    const baseAvgOff = (N * O / C) * (7 / (validDayCount > 0 ? validDayCount : 7));
    const maxOffCap = Math.max(1, Math.ceil(baseAvgOff - 0.0001));
    document.getElementById('offCodeInfo').innerText = `Angka OFF = OFF (Maks ${maxOffCap} orang/hari)`;
    // 2. Parse Kode Bulan Sebelumnya jika diisi
    const prevInputText = document.getElementById('prevMonthInput').value.trim();
    const prevEmpStates = {};
    if (prevInputText.length > 0) {
      const lines = prevInputText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let matrixPrev = lines.map(l => l.split(/\t+|\s+/));
      // Jika format bulan lalu Vertikal (Baris = Hari, Kolom = Karyawan), Transpose dulu
      if (matrixPrev.length > N && matrixPrev[0].length === N) {
        const transposedPrev = [];
        for (let col = 0; col < N; col++) {
          const empRow = [];
          for (let row = 0; row < matrixPrev.length; row++) {
            empRow.push(matrixPrev[row][col]);
          }
          transposedPrev.push(empRow);
        }
        matrixPrev = transposedPrev;
      }
      // Petakan baris ganjil/genap bulan lalu kembali ke ID Karyawan asli
      const half = Math.ceil(N / 2);
      for (let j = 0; j < Math.min(matrixPrev.length, N); j++) {
        let empIdx = j;
        if (matrixPrev.length === N) {
          if (j < half) {
            empIdx = j * 2; // Karyawan ganjil (1, 3, 5...)
          } else {
            empIdx = (j - half) * 2 + 1; // Karyawan genap (2, 4, 6...)
          }
        }
        const prevRow = matrixPrev[j];
        const lastVal = String(prevRow[prevRow.length - 1]).trim();
        let workCount = 0;
        let offCount = 0;
        let isOff = false;
        let postponedCount = 0;
        if (lastVal.toUpperCase() === "OFF") {
          let trailingOff = 0;
          for (let k = prevRow.length - 1; k >= 0; k--) {
            if (String(prevRow[k]).trim().toUpperCase() === "OFF") {
              trailingOff++;
            } else {
              break;
            }
          }
          if (trailingOff < O) {
            isOff = true;
            offCount = trailingOff;
            workCount = W;
          } else {
            isOff = false;
            offCount = 0;
            workCount = 0;
          }
        } else {
          const num = parseInt(lastVal);
          if (!isNaN(num)) {
            workCount = num;
            isOff = false;
            offCount = 0;
            if (workCount >= W) {
              postponedCount = workCount - W + 1;
            }
          }
        }
        prevEmpStates[empIdx] = { workCount, offCount, isOff, postponedCount };
      }
    }
    // 3. Inisialisasi State Karyawan (Lanjutan Bulan Lalu atau Generator Awal)
    const employees = [];
    for (let i = 0; i < N; i++) {
      if (prevEmpStates[i]) {
        employees.push({
          id: i,
          workCount: prevEmpStates[i].workCount,
          offCount: prevEmpStates[i].offCount,
          isOff: prevEmpStates[i].isOff,
          postponedCount: prevEmpStates[i].postponedCount
        });
      } else {
        const group = Math.floor(i / C);
        const phase = (i + group) % C;
        let workCount = 0;
        let offCount = 0;
        let isOff = false;
        if (phase < W) {
          workCount = phase;
          isOff = false;
        } else {
          isOff = true;
          offCount = phase - W;
          workCount = W;
        }
        employees.push({
          id: i,
          workCount: workCount,
          offCount: offCount,
          isOff: isOff,
          postponedCount: 0
        });
      }
    }
    // 4. Simulasi Generator Harian
    const rawMatrix = []; // [Hari][Karyawan]
    for (let d = 0; d < totalDays; d++) {
      const currentDate = new Date(startDate);
      currentDate.setDate(startDate.getDate() + d);
      const dayOfWeek = currentDate.getDay();
      const isRestricted = restrictedDays.includes(dayOfWeek);
      const maxOffToday = isRestricted ? 0 : maxOffCap;
      const candidates = [];
      for (let emp of employees) {
        if (emp.isOff && emp.offCount < O) {
          candidates.push(emp);
        } else if (!emp.isOff && emp.workCount >= W) {
          candidates.push(emp);
        } else if (emp.postponedCount > 0) {
          candidates.push(emp);
        }
      }
      candidates.sort((a, b) => {
        if (a.isOff !== b.isOff) return b.isOff ? 1 : -1;
        if (b.postponedCount !== a.postponedCount) return b.postponedCount - a.postponedCount;
        if (b.workCount !== a.workCount) return b.workCount - a.workCount;
        return a.id - b.id;
      });
      const grantedOffSet = new Set();
      const effectiveCap = (candidates.length > maxOffCap * 2 && !isRestricted) ? maxOffCap + 1 : maxOffToday;
      for (let k = 0; k < Math.min(candidates.length, effectiveCap); k++) {
        grantedOffSet.add(candidates[k].id);
      }
      const dayRow = [];
      for (let emp of employees) {
        if (grantedOffSet.has(emp.id)) {
          dayRow.push("OFF");
          emp.isOff = true;
          emp.offCount++;
          emp.postponedCount = 0;
          if (emp.offCount >= O) {
            emp.isOff = false;
            emp.offCount = 0;
            emp.workCount = 0;
          }
        } else {
          if (emp.isOff || emp.workCount >= W || emp.postponedCount > 0) {
            emp.postponedCount++;
          }
          emp.isOff = false;
          emp.offCount = 0;
          emp.workCount++;
          dayRow.push(emp.workCount);
        }
      }
      rawMatrix.push(dayRow);
    }
    // Ekstrak baris per karyawan (indeks 0 s.d N-1)
    const originalEmployeeRows = [];
    for (let empIdx = 0; empIdx < N; empIdx++) {
      const empRow = [];
      for (let dayIdx = 0; dayIdx < totalDays; dayIdx++) {
        empRow.push(rawMatrix[dayIdx][empIdx]);
      }
      originalEmployeeRows.push(empRow);
    }
    // 5. Susun Urutan Ganjil Dulu (1, 3, 5, 7...), Lalu Genap (2, 4, 6, 8...)
    const reorderedRows = [];
    for (let i = 0; i < N; i += 2) {
      reorderedRows.push(originalEmployeeRows[i]);
    }
    for (let i = 1; i < N; i += 2) {
      reorderedRows.push(originalEmployeeRows[i]);
    }
    // 6. Format Output ke Textarea
    let resultText = "";
    if (layout === "vertical") {
      const verticalMatrix = [];
      for (let d = 0; d < totalDays; d++) {
        const dayRow = [];
        for (let emp = 0; emp < N; emp++) {
          dayRow.push(reorderedRows[emp][d]);
        }
        verticalMatrix.push(dayRow);
      }
      resultText = verticalMatrix.map(r => r.join("\t")).join("\n");
    } else {
      resultText = reorderedRows.map(r => r.join("\t")).join("\n");
    }
    document.getElementById('outputArea').value = resultText;
  }
  function copyToClipboard() {
    const textarea = document.getElementById('outputArea');
    if (!textarea.value) return;
    textarea.select();
    document.execCommand('copy');
    alert('Kode angka berhasil disalin! Anda bisa langsung lakukan Paste (Ctrl+V) di Excel.');
  }
  window.onload = generateRoster;
</script>
