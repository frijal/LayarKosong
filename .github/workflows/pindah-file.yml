name: 📨 File Mover & Copier

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Pilih operasi'
        required: true
        default: 'copy'
        type: choice
        options:
          - copy
          - move
      source:
        description: 'Path sumber (contoh: artikel/index.html atau artikel/*.html)'
        required: true
        type: string
      destination:
        description: 'Folder tujuan (contoh: backup/ atau arsip/2026/)'
        required: true
        type: string
      commit_message:
        description: 'Pesan commit (opsional)'
        required: false
        default: 'chore: pindahkan file via dispatch'
        type: string
      create_dest:
        description: 'Buat folder tujuan jika belum ada'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  file-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Konfigurasi Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validasi input
        run: |
          echo "Operasi   : ${{ inputs.operation }}"
          echo "Sumber    : ${{ inputs.source }}"
          echo "Tujuan    : ${{ inputs.destination }}"
          echo "Buat folder: ${{ inputs.create_dest }}"

          if [ -z "${{ inputs.source }}" ]; then
            echo "::error::Path sumber tidak boleh kosong."
            exit 1
          fi
          if [ -z "${{ inputs.destination }}" ]; then
            echo "::error::Path tujuan tidak boleh kosong."
            exit 1
          fi
          if [ "${{ inputs.source }}" = "${{ inputs.destination }}" ]; then
            echo "::error::Sumber dan tujuan tidak boleh sama."
            exit 1
          fi

      - name: Siapkan folder tujuan
        if: ${{ inputs.create_dest == true }}
        run: |
          mkdir -p "${{ inputs.destination }}"

      - name: Cek folder tujuan
        if: ${{ inputs.create_dest == false }}
        run: |
          if [ ! -d "${{ inputs.destination }}" ]; then
            echo "::error::Folder tujuan '${{ inputs.destination }}' tidak ditemukan."
            exit 1
          fi

      - name: Eksekusi copy
        if: ${{ inputs.operation == 'copy' }}
        run: |
          shopt -s nullglob
          set -e
          matched=0
          for f in ${{ inputs.source }}; do
            if [ -f "$f" ]; then
              echo "Menyalin: $f -> ${{ inputs.destination }}"
              cp -v "$f" "${{ inputs.destination }}"
              matched=$((matched+1))
            elif [ -d "$f" ]; then
              echo "Menyalin folder: $f -> ${{ inputs.destination }}"
              cp -rv "$f" "${{ inputs.destination }}"
              matched=$((matched+1))
            fi
          done
          if [ "$matched" -eq 0 ]; then
            echo "::error::Tidak ada file/folder yang cocok dengan '${{ inputs.source }}'."
            exit 1
          fi

      - name: Eksekusi move
        if: ${{ inputs.operation == 'move' }}
        run: |
          shopt -s nullglob
          set -e
          matched=0
          for f in ${{ inputs.source }}; do
            if [ -e "$f" ]; then
              echo "Memindahkan: $f -> ${{ inputs.destination }}"
              mv -v "$f" "${{ inputs.destination }}"
              matched=$((matched+1))
            fi
          done
          if [ "$matched" -eq 0 ]; then
            echo "::error::Tidak ada file/folder yang cocok dengan '${{ inputs.source }}'."
            exit 1
          fi

      - name: Commit dan push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "${{ inputs.commit_message }}"
          git push
